<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101329">

  <title>RetroReplay — Image Assets</title>

  <style>
    :root {
      --background: #101329;
      --surface: #20223d;
      --border: #383052;
      --accent: #ff4fcf;
      --link: #9bc7ff;
      --text: #eeeeee;
      --muted: #aaaabb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 8px;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    #search {
      width: 100%;
      padding: 13px;
      margin: 15px 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid #51416f;
      border-radius: 6px;
      font-size: 15px;
    }

    #search:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #status {
      min-height: 24px;
    }

    #images {
      display: grid;
      gap: 10px;
    }

    .folder {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .folder > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      cursor: pointer;
      font-weight: bold;
      list-style: none;
      user-select: none;
    }

    .folder > summary::-webkit-details-marker {
      display: none;
    }

    .folder > summary::before {
      content: "\25B8";
      color: var(--accent);
      display: inline-block;
      transition: transform 0.15s;
    }

    .folder[open] > summary::before {
      transform: rotate(90deg);
    }

    .folder > summary:hover {
      background: #2a2c4d;
    }

    .folder > summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .folder-icon {
      font-size: 18px;
    }

    .folder-count {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: normal;
    }

    .folder-contents {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px 12px;
    }

    .folder .folder {
      background: var(--background);
    }

    .image-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .folder .image-link {
      background: #191b35;
    }

    .image-details {
      flex: 1;
      min-width: 0;
    }

    .image-link a {
      color: var(--link);
      overflow-wrap: anywhere;
    }

    .filename {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    button {
      background: #d82b9c;
      color: white;
      border: 0;
      padding: 10px 13px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }

    button:hover {
      background: #f04cbd;
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        margin-top: 24px;
        padding: 0 12px;
      }

      .image-link {
        align-items: flex-start;
        flex-direction: column;
      }

      .image-link button {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>RETRO REPLAY</h1>
    <p>
      Image asset library. Browse the images in the repository,
      open an image, or copy its GitHub Pages URL.
    </p>
  </header>

  <div class="toolbar">
    <button id="refresh" type="button">Refresh images</button>
    <button id="clearSearch" type="button">Clear search</button>
    <button id="expandAll" type="button">Expand all</button>
    <button id="collapseAll" type="button">Collapse all</button>
  </div>

  <input
    id="search"
    type="search"
    placeholder="Search filenames and folders..."
    aria-label="Search image filenames and folders"
  >

  <p id="status" role="status" aria-live="polite">
    Loading images from GitHub...
  </p>

  <main id="images" aria-label="Repository image assets"></main>

  <script>
    "use strict";

    // Repository configuration
    const OWNER = "SgtEpsilon";
    const REPO = "RetroReplay";

    const API_BASE =
      `https://api.github.com/repos/${OWNER}/${REPO}`;

    const PAGES_BASE =
      `https://${OWNER.toLowerCase()}.github.io/${REPO}/`;

    const IMAGE_EXTENSIONS =
      /\.(png|jpe?g|gif|webp|bmp|svg|avif|ico)$/i;

    const container = document.getElementById("images");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    const refreshButton = document.getElementById("refresh");
    const clearSearchButton = document.getElementById("clearSearch");

    let allImages = [];
    let loadInProgress = false;

    // Folder paths the user has opened (kept across searches/refreshes).
    const openFolders = new Set();

    // Safely encode each section of a repository path.
    // Folder separators remain intact.
    function getPagesUrl(path) {
      const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

      return PAGES_BASE + encodedPath;
    }

    // Create elements without inserting repository data as HTML.
    function createElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    async function copyToClipboard(url, button) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
        } else {
          throw new Error("Clipboard API unavailable");
        }

        button.textContent = "Copied!";
      } catch {
        window.prompt("Copy this image URL:", url);
        button.textContent = "Copy link";
      }

      if (button.textContent === "Copied!") {
        setTimeout(() => {
          button.textContent = "Copy link";
        }, 1500);
      }
    }

    // Build a folder tree from a flat list of image paths.
    function buildTree(images) {
      const root = { name: "", path: "", folders: new Map(), images: [] };

      for (const image of images) {
        const parts = image.path.split("/");
        const fileName = parts.pop();
        let node = root;
        let currentPath = "";

        for (const part of parts) {
          currentPath = currentPath ? `${currentPath}/${part}` : part;

          if (!node.folders.has(part)) {
            node.folders.set(part, {
              name: part,
              path: currentPath,
              folders: new Map(),
              images: []
            });
          }

          node = node.folders.get(part);
        }

        node.images.push({ ...image, fileName });
      }

      return root;
    }

    function countImages(node) {
      let total = node.images.length;

      for (const child of node.folders.values()) {
        total += countImages(child);
      }

      return total;
    }

    function createImageRow(image, showFullPath) {
      const row = createElement("article", "image-link");
      const details = createElement("div", "image-details");

      const link = createElement(
        "a",
        "",
        showFullPath ? image.path : image.fileName
      );
      link.href = image.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const urlLabel = createElement("span", "filename", image.url);
      const copyButton = createElement("button", "", "Copy link");
      copyButton.type = "button";

      copyButton.addEventListener("click", () => {
        copyToClipboard(image.url, copyButton);
      });

      details.append(link, urlLabel);
      row.append(details, copyButton);
      return row;
    }

    function createFolderElement(node, searching) {
      const folder = document.createElement("details");
      folder.className = "folder";
      folder.dataset.path = node.path;

      // While searching, matching folders open automatically.
      // Otherwise, remember what the user opened.
      folder.open = searching || openFolders.has(node.path);

      folder.addEventListener("toggle", () => {
        if (search.value.trim()) {
          return;
        }

        if (folder.open) {
          openFolders.add(node.path);
        } else {
          openFolders.delete(node.path);
        }
      });

      const summary = document.createElement("summary");
      summary.append(
        createElement("span", "folder-icon", "\uD83D\uDCC1"),
        createElement("span", "", node.name),
        createElement(
          "span",
          "folder-count",
          `${countImages(node)} ${countImages(node) === 1 ? "image" : "images"}`
        )
      );

      const contents = createElement("div", "folder-contents");

      const subfolders = [...node.folders.values()]
        .sort((a, b) => a.name.localeCompare(b.name));

      for (const child of subfolders) {
        contents.appendChild(createFolderElement(child, searching));
      }

      const files = [...node.images]
        .sort((a, b) => a.fileName.localeCompare(b.fileName));

      for (const image of files) {
        contents.appendChild(createImageRow(image, false));
      }

      folder.append(summary, contents);
      return folder;
    }

    function renderImages() {
      const query = search.value.trim().toLowerCase();
      const searching = query.length > 0;

      const filteredImages = allImages.filter(image =>
        image.path.toLowerCase().includes(query)
      );

      container.replaceChildren();

      const tree = buildTree(filteredImages);
      const fragment = document.createDocumentFragment();

      // Folders first, then any images sitting in the repository root.
      const topFolders = [...tree.folders.values()]
        .sort((a, b) => a.name.localeCompare(b.name));

      for (const folder of topFolders) {
        fragment.appendChild(createFolderElement(folder, searching));
      }

      const rootFiles = [...tree.images]
        .sort((a, b) => a.fileName.localeCompare(b.fileName));

      for (const image of rootFiles) {
        fragment.appendChild(createImageRow(image, false));
      }

      container.appendChild(fragment);

      if (allImages.length === 0) {
        return;
      }

      status.textContent =
        `Showing ${filteredImages.length} of ${allImages.length} images`;
    }

    function setAllFolders(open) {
      const folders = container.querySelectorAll("details.folder");

      for (const folder of folders) {
        folder.open = open;

        if (!search.value.trim()) {
          if (open) {
            openFolders.add(folder.dataset.path);
          } else {
            openFolders.delete(folder.dataset.path);
          }
        }
      }
    }

    async function loadImages() {
      if (loadInProgress) {
        return;
      }

      loadInProgress = true;
      refreshButton.disabled = true;
      refreshButton.textContent = "Loading...";
      status.textContent = "Fetching the latest repository files...";

      try {
        // Discover the default branch dynamically.
        const repoResponse = await fetch(API_BASE, {
          headers: {
            Accept: "application/vnd.github+json"
          },
          cache: "no-store"
        });

        if (!repoResponse.ok) {
          if (repoResponse.status === 403 ||
              repoResponse.status === 429) {
            throw new Error(
              "GitHub API rate limit reached. Wait a minute and retry."
            );
          }

          if (repoResponse.status === 404) {
            throw new Error(
              "Repository not found. Check that it is public."
            );
          }

          throw new Error(
            `GitHub returned HTTP ${repoResponse.status}.`
          );
        }

        const repoData = await repoResponse.json();
        const branch = repoData.default_branch;

        if (!branch) {
          throw new Error("Could not determine the default branch.");
        }

        // Retrieve the entire repository file tree recursively.
        const treeUrl =
          `${API_BASE}/git/trees/${encodeURIComponent(branch)}?recursive=1`;

        const treeResponse = await fetch(treeUrl, {
          headers: {
            Accept: "application/vnd.github+json"
          },
          cache: "no-store"
        });

        if (!treeResponse.ok) {
          throw new Error(
            `Could not load repository files (HTTP ${treeResponse.status}).`
          );
        }

        const treeData = await treeResponse.json();

        if (!Array.isArray(treeData.tree)) {
          throw new Error("GitHub returned an invalid file list.");
        }

        // Discover supported image formats automatically.
        const discoveredImages = treeData.tree
          .filter(file =>
            file.type === "blob" &&
            IMAGE_EXTENSIONS.test(file.path)
          )
          .map(file => ({
            path: file.path,
            url: getPagesUrl(file.path)
          }))
          .sort((a, b) => a.path.localeCompare(b.path));

        allImages = discoveredImages;

        renderImages();

        if (treeData.truncated) {
          status.textContent +=
            ". Warning: GitHub truncated the repository file list.";
        }

        if (allImages.length === 0) {
          status.textContent =
            "No supported image files were found in the repository.";
        }
      } catch (error) {
        status.textContent =
          `Unable to load images: ${error.message}`;

        if (allImages.length === 0) {
          container.replaceChildren();

          const retryButton = createElement(
            "button",
            "",
            "Try again"
          );

          retryButton.type = "button";
          retryButton.addEventListener("click", loadImages);

          container.appendChild(retryButton);
        }
      } finally {
        loadInProgress = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "Refresh images";
      }
    }

    // Search updates instantly without another GitHub request.
    search.addEventListener("input", renderImages);

    clearSearchButton.addEventListener("click", () => {
      search.value = "";
      renderImages();
      search.focus();
    });

    document.getElementById("expandAll")
      .addEventListener("click", () => setAllFolders(true));

    document.getElementById("collapseAll")
      .addEventListener("click", () => setAllFolders(false));

    // Manually fetch the latest repository contents.
    refreshButton.addEventListener("click", loadImages);

    // Automatically load the gallery on page startup.
    loadImages();
  </script>
</body>
</html>
